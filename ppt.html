<style>
:root{

}
@media (prefers-color-scheme:dark){

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;word-break:keep-all}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}

.top{padding:36px 0 8px}
.back{display:inline-block;padding:8px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.9rem;transition:.25s}
.back:hover{transform:translateX(-3px);border-color:var(--main);color:var(--main)}
header.title{padding:28px 0 28px}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:.85rem;padding:6px 16px;border-radius:999px;margin-bottom:14px}
h1{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:800;letter-spacing:-.03em;line-height:1.3}
header.title p{margin-top:10px;color:var(--sub)}

/* 아코디언 */
.list{display:grid;gap:14px;padding-bottom:70px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:border-color .25s,box-shadow .25s}
.acc.open{border-color:var(--main);box-shadow:var(--shadow)}
.head{width:100%;display:flex;align-items:center;gap:14px;padding:20px 24px;background:none;border:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.ico{flex:none;width:48px;height:48px;border-radius:50%;background:var(--main-soft);display:grid;place-items:center;font-size:1.4rem}
.head h2{flex:1;font-size:1.25rem;font-weight:700}
.count{font-size:.8rem;font-weight:700;background:var(--main-soft);color:var(--main);padding:4px 12px;border-radius:999px}
.arrow{flex:none;width:30px;height:30px;border-radius:50%;background:var(--main-soft);color:var(--main);display:grid;place-items:center;font-size:.8rem;transition:transform .3s}
.acc.open .arrow{transform:rotate(180deg)}
.head:focus-visible{outline:3px solid var(--main);outline-offset:-3px;border-radius:var(--radius)}

.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.acc.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
ol.units{list-style:none;padding:2px 20px 20px;display:grid;gap:8px}
.unit{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:var(--bg);border:1px solid transparent;transition:.2s}
a.unit:hover{border-color:var(--main);transform:translateX(4px)}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--main);color:#fff;font-size:.82rem;font-weight:800;display:grid;place-items:center}
.uname{flex:1;font-weight:600}
.state{flex:none;font-size:.78rem;font-weight:700;padding:3px 12px;border-radius:999px}
.state.go{background:var(--main);color:#fff}
.state.soon{background:var(--accent-soft);color:var(--accent)}

/* 소단원 */
button.unit{width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer}
button.unit:hover{border-color:var(--main)}
button.unit:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.state.cnt{background:var(--main-soft);color:var(--main)}
.sub-arrow{flex:none;font-size:.7rem;color:var(--main);transition:transform .3s}
li.open>.unit .sub-arrow{transform:rotate(180deg)}
li.open>.unit{border-color:var(--main)}
.subwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
li.open>.subwrap{grid-template-rows:1fr}
.subwrap>div{overflow:hidden}
ul.subs{list-style:none;padding:8px 0 4px 38px;display:grid;gap:6px}
.mids{padding:10px 0 6px 38px;display:grid;gap:16px}
.mid h4{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:800;color:var(--main);margin:0 0 4px 2px}
.mid h4::before{content:"";flex:none;width:5px;height:16px;border-radius:3px;background:var(--main)}
.mid ul.subs{padding:6px 0 0 0}
.sub{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:.94rem;transition:.2s}
a.sub:hover{border-color:var(--main);transform:translateX(4px)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sname{flex:1;font-weight:500}
.sub.multi{flex-direction:column;align-items:stretch;gap:10px}
.subhead{display:flex;align-items:center;gap:10px}
.links{display:flex;flex-wrap:wrap;gap:6px;padding-left:18px}
.lk{font-size:.82rem;font-weight:700;padding:5px 14px;border-radius:999px;background:var(--main);color:#fff;transition:.2s}
a.lk:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(31,79,216,.25)}
.lk.soon{background:var(--accent-soft);color:var(--accent)}

@media (prefers-reduced-motion:reduce){.body,.arrow,.acc,.unit,.subwrap,.sub,.sub-arrow{transition:none}}
@media (max-width:520px){.mids,ul.subs{padding-left:14px}.mid ul.subs{padding-left:0}.head{padding:16px 16px}.ico{width:42px;height:42px}ol.units{padding:2px 12px 16px}}

const list = document.getElementById('list');

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/* 소단원 한 줄 (자료 하나 또는 여러 개) */
function subRow(it){
  const li = document.createElement('li');
  if (Array.isArray(it.links) && it.links.length > 0) {
    const r = el('div', 'sub multi');
    const sh = el('div', 'subhead');
    sh.append(el('span', 'dot'), el('span', 'sname', it.name));
    const lks = el('div', 'links');
    it.links.forEach(l => {
      const b = el(l.url ? 'a' : 'span', 'lk' + (l.url ? '' : ' soon'), l.url ? l.name + ' ↗' : l.name + ' (준비 중)');
      if (l.url) { b.href = l.url; b.target = '_blank'; b.rel = 'noopener'; }
      lks.appendChild(b);
    });
    r.append(sh, lks);
    li.appendChild(r);
  } else {
    const r = el(it.url ? 'a' : 'div', 'sub');
    if (it.url) { r.href = it.url; r.target = '_blank'; r.rel = 'noopener'; }
    r.append(el('span', 'dot'), el('span', 'sname', it.name), el('span', 'state ' + (it.url ? 'go' : 'soon'), it.url ? '열기 ↗' : '준비 중'));
    li.appendChild(r);
  }
  return li;
}

function subList(arr){
  const ul = el('ul', 'subs');
  arr.forEach(it => ul.appendChild(subRow(it)));
  return ul;
}

DATA.forEach((g, gi) => {
  const acc = el('section', 'acc');

  const head = el('button', 'head');
  head.type = 'button';
  head.setAttribute('aria-expanded', 'false');
  head.setAttribute('aria-controls', 'panel-' + gi);
  const arrow = el('span', 'arrow', '▼'); arrow.setAttribute('aria-hidden', 'true');
  head.append(el('span', 'ico', g.icon || '📘'), el('h2', '', g.grade), arrow);

  const body = el('div', 'body'); body.id = 'panel-' + gi;
  const inner = el('div');
  const ol = el('ol', 'units');

  g.units.forEach((u, i) => {
    const li = document.createElement('li');
    const mids = Array.isArray(u.mids) ? u.mids : [];
    const subs = Array.isArray(u.subs) ? u.subs : [];

    if (mids.length || subs.length) {
      /* 누르면 펼쳐지는 대단원 */
      li.className = 'has-subs';
      const row = el('button', 'unit');
      row.type = 'button';
      row.setAttribute('aria-expanded', 'false');
      const sa = el('span', 'sub-arrow', '▼'); sa.setAttribute('aria-hidden', 'true');
      row.append(el('span', 'num', i + 1), el('span', 'uname', u.name), sa);

      const wrap = el('div', 'subwrap');
      const wi = el('div');
      if (mids.length) {
        const box = el('div', 'mids');
        mids.forEach(m => {
          const mid = el('div', 'mid');
          mid.append(el('h4', '', m.name), subList(Array.isArray(m.subs) ? m.subs : []));
          box.appendChild(mid);
        });
        wi.appendChild(box);
      } else {
        wi.appendChild(subList(subs));
      }
      wrap.appendChild(wi);
      li.append(row, wrap);

      row.addEventListener('click', () => {
        const open = li.classList.toggle('open');
        row.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    } else {
      /* 하위 단원이 없는 대단원 */
      const row = el(u.url ? 'a' : 'div', 'unit');
      if (u.url) { row.href = u.url; row.target = '_blank'; row.rel = 'noopener'; }
      row.append(el('span', 'num', i + 1), el('span', 'uname', u.name), el('span', 'state ' + (u.url ? 'go' : 'soon'), u.url ? '열기 ↗' : '준비 중'));
      li.appendChild(row);
    }
    ol.appendChild(li);
  });

  inner.appendChild(ol); body.appendChild(inner);
  acc.append(head, body);
  list.appendChild(acc);

  head.addEventListener('click', () => {
    const open = acc.classList.toggle('open');
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
});
